name: Update Immich

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: immich-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Require a token that triggers pull_request checks
        env:
          AUTO_UPDATE_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          if [ -z "$AUTO_UPDATE_TOKEN" ]; then
            echo "::error::Add the existing AUTO_UPDATE_TOKEN repository Actions secret."
            echo "::error::A default GITHUB_TOKEN PR would not trigger the required Validate check."
            exit 1
          fi

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update only Immich and classify the version
        id: update
        run: |
          set -euo pipefail

          old_version="$(nix eval --raw .#nixosConfigurations.nixos.config.services.immich.package.version)"
          # Reject any change to another locked package source, including the
          # stable host, Codex, Herdr and their transitive inputs.
          jq -S '.nodes | del(."immich-nixpkgs")' flake.lock > "$RUNNER_TEMP/other-inputs.json"
          nix flake update immich-nixpkgs
          jq -S '.nodes | del(."immich-nixpkgs")' flake.lock | cmp "$RUNNER_TEMP/other-inputs.json" -

          if git diff --quiet -- flake.lock; then
            echo "No change to the Immich lock input."
            exit 0
          fi

          new_version="$(nix eval --raw .#nixosConfigurations.nixos.config.services.immich.package.version)"
          if [ "$old_version" = "$new_version" ]; then
            echo "The pin changed but Immich is still $new_version; skipping package-source churn."
            git restore -- flake.lock
            exit 0
          fi

          python3 - "$old_version" "$new_version" <<'PY'
          import os
          import re
          import sys

          old, new = sys.argv[1:3]
          version_pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          if not version_pattern.fullmatch(old) or not version_pattern.fullmatch(new):
              sys.exit(f"Cannot safely classify Immich versions: {old!r} -> {new!r}")
          old_parts = tuple(map(int, old.split(".")))
          new_parts = tuple(map(int, new.split(".")))
          if new_parts <= old_parts:
              sys.exit(f"Refusing an Immich downgrade/non-upgrade: {old} -> {new}")
          release_type = (
              "patch" if new_parts[:2] == old_parts[:2]
              else "minor" if new_parts[0] == old_parts[0]
              else "major"
          )
          print(f"Immich {old} -> {new} ({release_type})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed=true\nold_version={old}\nnew_version={new}\nrelease_type={release_type}\n")
          PY

      - name: Check flake
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --show-trace

      - name: Build full NixOS system
        if: steps.update.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --no-link --print-build-logs

      - name: Create or update Immich PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          branch-token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          add-paths: flake.lock
          branch: automation/update-immich
          base: master
          delete-branch: true
          commit-message: 'chore(immich): update from ${{ steps.update.outputs.old_version }} to ${{ steps.update.outputs.new_version }}'
          title: 'chore(immich): update from ${{ steps.update.outputs.old_version }} to ${{ steps.update.outputs.new_version }}'
          body: |
            Immich update: **${{ steps.update.outputs.old_version }} → ${{ steps.update.outputs.new_version }}**
            Release type: **${{ steps.update.outputs.release_type }}**.

            Updates only `immich-nixpkgs` in `flake.lock`; the host NixOS,
            Codex and Herdr sources are unchanged. Flake evaluation and a
            full NixOS build succeeded in the updater. The separate required
            GitHub Actions **Validate** check must pass before a merge.

            **Database migrations can be irreversible.** Ensure a recent,
            recoverable backup of both the Immich PostgreSQL database and the
            media directory before installing. Review Immich release notes.

            Only same-major-and-minor **patch** updates are eligible for
            optional auto-merge, and only when the repository variable
            `IMMICH_AUTO_MERGE_PATCH` is set to `true`. Other versions
            always require manual PR approval.

      - name: Auto-merge patch only when explicitly enabled and checks pass
        if: >-
          steps.update.outputs.release_type == 'patch' &&
          vars.IMMICH_AUTO_MERGE_PATCH == 'true' &&
          steps.cpr.outputs.pull-request-number != '' &&
          (steps.cpr.outputs.pull-request-operation == 'created' ||
           steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --match-head-commit "$PR_HEAD_SHA"
