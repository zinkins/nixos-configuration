name: Update Codex and Herdr

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-herdr-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # New Codex versions may require a full source build on an uncached runner.
    timeout-minutes: 120
    steps:
      - name: Require a token that triggers pull_request checks
        env:
          AUTO_UPDATE_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          if [ -z "$AUTO_UPDATE_TOKEN" ]; then
            echo "::error::Add repository Actions secret AUTO_UPDATE_TOKEN (fine-grained GitHub PAT with Contents and Pull requests read/write)."
            echo "::error::The default GITHUB_TOKEN cannot trigger the required Validate pull_request check for a bot-created PR."
            exit 1
          fi

      - name: Checkout production configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update only the Codex and Herdr package sources
        id: update
        run: |
          set -euo pipefail
          # Shared transitive flake-utils/systems dependencies belong to herdr-nix.
          # In particular, the stable host nixpkgs lock must never change.
          jq -S '.nodes | del(."codex-nixpkgs", ."herdr-nix", ."flake-utils", ."systems")' flake.lock > "$RUNNER_TEMP/other-inputs.json"
          nix flake update codex-nixpkgs herdr-nix
          jq -S '.nodes | del(."codex-nixpkgs", ."herdr-nix", ."flake-utils", ."systems")' flake.lock | cmp "$RUNNER_TEMP/other-inputs.json" -
          if ! git diff --quiet -- flake.lock; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Prevalidate before creating a production-bound PR. A separate
      # pull_request validation is required by the master ruleset as well.
      - name: Check flake
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --show-trace

      - name: Build NixOS system
        if: steps.update.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --no-link --print-build-logs

      # A PAT (not the default GITHUB_TOKEN) makes the real pull_request
      # Validate check run. Never bypass master ruleset or spoof check status.
      - name: Create or update the checked package-update PR
        id: cpr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          branch-token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          add-paths: flake.lock
          branch: automation/update-codex-herdr
          base: master
          delete-branch: true
          commit-message: 'chore(tools): update Codex and Herdr package sources'
          title: 'chore(tools): update Codex and Herdr package sources'
          body: |
            Update only the pinned Codex Nixpkgs and Herdr Nix package
            inputs (and Herdr's transitive flake inputs) in flake.lock.
            The stable host nixpkgs input and AI VPN isolation are unchanged.

            The updater ran `nix flake check` and built the full NixOS system
            before creating this PR. GitHub's required **Validate** check must
            also pass before the PR can auto-merge. A failed check leaves this
            PR open for inspection; the server never deploys an unmerged PR.

      # GitHub's master ruleset requires the "Validate" Actions check.
      # GitHub-native auto-merge waits for the real pull_request workflow,
      # which is triggered by the fine-grained PAT used to publish the PR.
      - name: Auto-merge only after required checks pass
        if: steps.cpr.outputs.pull-request-number != '' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --match-head-commit "$PR_HEAD_SHA"
